      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("codeacademy_user_prefs_v1");
          if (!raw) return;
          var prefs = JSON.parse(raw);
          var root = document.documentElement;
          if (prefs && prefs.mode === "light") {
            root.classList.remove("dark");
            root.style.colorScheme = "light";
          } else {
            root.classList.add("dark");
            root.style.colorScheme = "dark";
          }
          if (prefs && typeof prefs.fontSize === "number") {
            root.style.fontSize = Math.min(19, Math.max(14, prefs.fontSize)) + "px";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
